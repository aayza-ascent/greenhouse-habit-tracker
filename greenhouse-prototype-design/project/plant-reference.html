<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Greenhouse · Plant Stages Reference</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #fbf3e6; font-family: 'Pixelify Sans', system-ui, sans-serif; }
  body { color: #2a1a10; min-height: 100vh; }
  *, *::before, *::after { box-sizing: border-box; }
  svg { image-rendering: pixelated; image-rendering: crisp-edges; shape-rendering: crispEdges; }
  .header {
    padding: 28px 32px 12px;
    border-bottom: 3px solid #2a1a10;
    background: #fff5e2;
  }
  .title {
    font-family: 'Silkscreen', monospace; font-size: 28px; letter-spacing: 1px; margin: 0;
    text-shadow: 3px 3px 0 #d8b88f88;
  }
  .sub { font-size: 14px; color: #7a4a2c; margin-top: 4px; }
  .legend {
    display: flex; gap: 18px; flex-wrap: wrap; margin-top: 14px;
    font-family: 'Pixelify Sans'; font-size: 13px; color: #5a3a20;
  }
  .legend span b { color: #2a1a10; }

  /* grid */
  .gridwrap { padding: 16px 24px 60px; overflow-x: auto; }
  .grid {
    display: inline-grid;
    border: 3px solid #2a1a10;
    background: #fff5e2;
    box-shadow: 6px 6px 0 0 #2a1a1022;
  }
  .cell { border-right: 1px solid #d8b88f; border-bottom: 1px solid #d8b88f; }
  .cell:last-child { border-right: none; }
  .row-last .cell { border-bottom: none; }
  .corner, .colhdr, .rowhdr { background: #f3dfb6; border-right: 1px solid #2a1a10; border-bottom: 1px solid #2a1a10; }
  .colhdr {
    padding: 8px 6px; text-align: center;
    font-family: 'Silkscreen', monospace; font-size: 10px; color: #2a1a10; letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .colhdr .num { display: block; font-size: 14px; color: #c84a2e; margin-bottom: 2px; }
  .rowhdr {
    padding: 8px 12px;
    font-family: 'Silkscreen', monospace; font-size: 12px; color: #2a1a10;
    text-align: right; min-width: 110px;
    background: linear-gradient(90deg, #fff5e2, #f3dfb6);
  }
  .rowhdr .desc { display: block; font-family: 'Pixelify Sans'; font-size: 11px; color: #7a4a2c; margin-top: 2px; font-weight: 400; letter-spacing: 0; text-align: right; }
  .corner {
    background: #2a1a10;
    color: #f6c247; font-family: 'Silkscreen', monospace; font-size: 10px;
    padding: 8px;
    display: flex; align-items: flex-end; justify-content: flex-end;
    text-align: right; line-height: 1.2;
  }
  .cell {
    width: 122px; height: 156px;
    display: flex; align-items: center; justify-content: center;
    background:
      linear-gradient(#fff5e2 0%, #fff5e2 70%, #d8b88f 70%, #d8b88f 100%);
    position: relative;
  }
  .cell.alt {
    background:
      linear-gradient(#f9eed7 0%, #f9eed7 70%, #c8a87c 70%, #c8a87c 100%);
  }
  .cell.dead {
    background:
      linear-gradient(#3a2c20 0%, #3a2c20 70%, #1a1208 70%, #1a1208 100%);
  }
  .cell.thr {
    background:
      radial-gradient(circle at 50% 60%, #fff7c8 0%, #ffe5a0 30%, #fff5e2 60%, #d8b88f 70%, #d8b88f 100%);
  }
  .cell.glow {
    background:
      radial-gradient(circle at 50% 60%, #fff7c8 0%, #ffd56a 20%, #ffb04a 40%, #fff5e2 65%, #d8b88f 70%, #d8b88f 100%);
  }
  .cell.wilt {
    background:
      linear-gradient(#fae6c8 0%, #fae6c8 70%, #b89060 70%, #b89060 100%);
  }
  .cell.dying {
    background:
      linear-gradient(#e8d4a8 0%, #e8d4a8 70%, #8a6a3a 70%, #8a6a3a 100%);
  }
  .footer {
    padding: 16px 32px; border-top: 3px solid #2a1a10; background: #fff5e2;
    font-family: 'Pixelify Sans'; font-size: 13px; color: #7a4a2c;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="flowers-v2.jsx"></script>

<script type="text/babel">
const { FlowerV2, FLOWER_ORDER, FLOWERS_V2, STAGE_NAMES } = window;

const FLOWER_DESCRIPTIONS = {
  rose: 'Layered, thorny',
  tulip: 'Cup, tall',
  sunflower: 'Star, broad leaf',
  daisy: 'White petals',
  lavender: 'Spike, fragrant',
  lily: 'Trumpet, orange',
  poppy: 'Fern leaf, scarlet',
  bluebell: 'Hanging cluster',
  marigold: 'Layered orange',
  iris: 'Ruffled purple',
};

const STAGE_NUMS = ['00','01','02','03','04','05','06','07','08','09','10','11'];

function cellClass(stageIdx) {
  if (stageIdx === 11) return 'cell dead';
  if (stageIdx === 6) return 'cell thr';
  if (stageIdx === 7) return 'cell glow';
  if (stageIdx === 8) return 'cell wilt';
  if (stageIdx === 9) return 'cell wilt';
  if (stageIdx === 10) return 'cell dying';
  return 'cell' + (stageIdx % 2 ? ' alt' : '');
}

function App() {
  return (
    <>
      <div className="header">
        <h1 className="title">🌿 PLANT STAGES · REFERENCE</h1>
        <div className="sub">10 flower species × 12 life-cycle stages · pixel-RPG style · 28×38 sprite canvas</div>
        <div className="legend">
          <span>SCALE: <b>×4 (112×152px)</b></span>
          <span>POT: <b>shared terracotta</b></span>
          <span>DROOP: <b>stages 8–10 bend stem right</b></span>
          <span>BROWN-SHIFT: <b>petals desaturate from stage 8</b></span>
        </div>
      </div>

      <div className="gridwrap">
        <div className="grid" style={{ gridTemplateColumns: `auto repeat(12, 1fr)` }}>
          {/* Top-left corner */}
          <div className="corner">FLOWER ↓<br/>STAGE →</div>
          {/* Column headers */}
          {STAGE_NAMES.map((name, i) => (
            <div key={i} className="colhdr">
              <span className="num">{STAGE_NUMS[i]}</span>
              {name.toUpperCase()}
            </div>
          ))}

          {/* Rows */}
          {FLOWER_ORDER.map((flower, rIdx) => (
            <React.Fragment key={flower}>
              <div className="rowhdr">
                {FLOWERS_V2[flower].name.toUpperCase()}
                <span className="desc">{FLOWER_DESCRIPTIONS[flower]}</span>
              </div>
              {STAGE_NAMES.map((_, sIdx) => (
                <div key={sIdx} className={cellClass(sIdx)}>
                  <FlowerV2 type={flower} stage={sIdx} scale={4} />
                </div>
              ))}
            </React.Fragment>
          ))}
        </div>
      </div>

      <div className="footer">
        ⤴ Use this sheet as the source of truth for plant rendering in the prototype.
        Each sprite is procedurally composed from per-flower bloom + leaf + stem configs in <code>flowers-v2.jsx</code>.
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
