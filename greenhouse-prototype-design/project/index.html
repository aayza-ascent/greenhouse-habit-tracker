<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Greenhouse — Pixel Garden Tasks</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet" />
<style>
  html, body, #root { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
  body { font-family: 'Pixelify Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  *, *::before, *::after { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  /* pixel crisp */
  svg { image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="browser-window.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="pixel-art.jsx"></script>
<script type="text/babel" src="store.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="app-shell.jsx"></script>

<script type="text/babel">
function App() {
  const { useStore } = window;
  return (
    <window.StoreProvider>
      <Inner />
    </window.StoreProvider>
  );
}

function Inner() {
  const { palette } = window.useStore();
  return (
    <>
      <window.DesignCanvas>
        <window.DCSection id="hero" title="Greenhouse · Hero View" subtitle="Tap a plant to inspect · drag to rearrange · bottom-tab navigation between all screens">
          <window.DCArtboard id="ios-greenhouse" label="iOS · Greenhouse" width={360} height={760}>
            <window.IOSGreenhouse palette={palette} initialTab="greenhouse" />
          </window.DCArtboard>
          <window.DCArtboard id="ios-tasks" label="iOS · Tasks" width={360} height={760}>
            <window.IOSGreenhouse palette={palette} initialTab="tasks" />
          </window.DCArtboard>
          <window.DCArtboard id="ios-shop" label="iOS · Shop" width={360} height={760}>
            <window.IOSGreenhouse palette={palette} initialTab="shop" />
          </window.DCArtboard>
          <window.DCArtboard id="ios-stats" label="iOS · Stats" width={360} height={760}>
            <window.IOSGreenhouse palette={palette} initialTab="stats" />
          </window.DCArtboard>
          <window.DCArtboard id="ios-profile" label="iOS · Profile" width={360} height={760}>
            <window.IOSGreenhouse palette={palette} initialTab="profile" />
          </window.DCArtboard>
        </window.DCSection>

        <window.DCSection id="flows" title="Flows" subtitle="Onboarding · creating a task · the WOW moment">
          <window.DCArtboard id="onboarding" label="Onboarding" width={360} height={760}>
            <window.OnboardingFrame palette={palette} />
          </window.DCArtboard>
          <window.DCArtboard id="newtask" label="New Task" width={360} height={760}>
            <window.NewTaskFrame palette={palette} />
          </window.DCArtboard>
          <window.DCArtboard id="celebration" label="Task Complete · Plant Grows" width={360} height={760}>
            <window.CelebrationFrame palette={palette} />
          </window.DCArtboard>
        </window.DCSection>

        <window.DCSection id="web" title="Web · Companion View" subtitle="Same garden, browser-sized">
          <window.DCArtboard id="web-garden" label="Browser · Garden" width={1000} height={620}>
            <window.WebGreenhouseView palette={palette} />
          </window.DCArtboard>
        </window.DCSection>

        <window.DCPostIt top={20} left={1100} rotate={3} width={220}>
          Toggle <b>Tweaks</b> in the toolbar to swap palettes, jump time-of-day, change grid size, and trigger demo events (complete a task, decay a day).
        </window.DCPostIt>
      </window.DesignCanvas>
      <window.GreenhouseTweaks />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
